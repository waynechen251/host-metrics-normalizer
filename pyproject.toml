[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "host-metrics-normalizer"
description = "Cross-platform host metrics normalization layer for Prometheus and Grafana."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "prometheus_client",
    "PyYAML",
    "requests",
    "pywin32; sys_platform == \"win32\"",
    "nvidia-ml-py==13.610.43",
]

[project.optional-dependencies]
dev = ["pytest"]
build = ["pyinstaller"]

[project.scripts]
host-metrics-normalizer = "host_metrics_normalizer.main:main"

[tool.setuptools.dynamic]
version = { attr = "host_metrics_normalizer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
